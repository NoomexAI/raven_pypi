<svg xmlns="http://www.w3.org/2000/svg" width="960" height="840" viewBox="0 0 960 840" role="img" aria-labelledby="title description">
  <title id="title">Local embedded retrieval</title>
  <desc id="description">Within Engineering, chunk hits in reaction_wheel.txt and EPS.txt resolve into a ranked list of distinct sections. Two chunk hits for reaction_wheel.txt Section 1 produce one section result. The first four complete sections are returned.</desc>
  <style>
    svg { display: block; margin: 0 auto; color: #202020; background: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .box { fill: #fafafa; stroke: #aaa; stroke-width: 1.5; }
    .strong { fill: #f0f0f0; stroke: #333; stroke-width: 1.5; }
    .panel { fill: none; stroke: #ccc; stroke-width: 1; }
    .line { fill: none; stroke: #777; stroke-width: 1.5; }
    .optional { stroke-dasharray: 5 4; }
    .arrow { fill: #777; }
    text { fill: currentColor; text-anchor: middle; font-size: 16px; }
    .heading { font-size: 18px; font-weight: 600; }
    .small { fill: #595959; font-size: 14px; }
    @media (prefers-color-scheme: dark) {
      svg { color: #eee; background: #111; }
      .box { fill: #191919; stroke: #777; }
      .strong { fill: #292929; stroke: #ccc; }
      .panel { stroke: #555; }
      .line { stroke: #aaa; }
      .arrow { fill: #aaa; }
      .small { fill: #bbb; }
    }
  </style>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="arrow" d="M 0 0 L 10 5 L 0 10 Z"/></marker></defs>
  <g class="step">
    <rect class="strong" x="140" y="20" width="680" height="76" rx="8"/>
  <text class="heading" x="480" y="46">Local embedded retrieval</text>
  <text x="480" y="64">Embed the query; search Engineering's chunk index.</text>
  <text class="small" x="480" y="82">Illustrative search · top_k = 4 sections</text>
  </g>
  <path class="line" d="M 480 96 V 110 H 239 V 131" marker-end="url(#arrow)"/>
  <path class="line" d="M 480 110 H 721 V 131" marker-end="url(#arrow)"/>
  <g class="step">
    <rect class="box" x="24" y="134" width="430" height="182" rx="8"/>
  <text class="heading" x="239" y="162">reaction_wheel.txt</text>
  <text x="239" y="188">Section 1 · chunk 0 → 0.94</text>
  <text x="239" y="214">Section 1 · chunk 1 → 0.89</text>
  <text x="239" y="240">Section 3 · chunk 0 → 0.84</text>
  <text x="239" y="266">Section 5 · chunk 0 → 0.60</text>
  </g>
  <g class="step">
    <rect class="box" x="506" y="134" width="430" height="182" rx="8"/>
  <text class="heading" x="721" y="162">EPS.txt</text>
  <text x="721" y="188">Section 2 · chunk 1 → 0.91</text>
  <text x="721" y="214">Section 1 · chunk 0 → 0.79</text>
  <text x="721" y="240">Section 4 · chunk 0 → 0.65</text>
  <text class="small" x="721" y="266">One file can contribute several sections.</text>
  </g>
  <path class="line" d="M 239 316 V 332 H 480 V 347" marker-end="url(#arrow)"/>
  <path class="line" d="M 721 316 V 332 H 480" marker-end="url(#arrow)"/>
  <g class="step">
    <rect class="box" x="140" y="350" width="680" height="76" rx="8"/>
  <text class="heading" x="480" y="376">Sort collected chunk hits → resolve and deduplicate sections</text>
  <text class="small" x="480" y="394">Deduplicate by section_id within Engineering.</text>
  <text class="small" x="480" y="412">A section's first ranked hit determines its position.</text>
  </g>
  <path class="line" d="M 480 426 V 443 H 300 V 457" marker-end="url(#arrow)"/>
  <rect class="panel" x="24" y="460" width="552" height="296" rx="8"/>
  <text class="heading" x="300" y="488">Combined ranking across both files</text>
  <text class="small" x="300" y="510">Illustrative internal best-hit similarity</text>
  <g class="step">
    <rect class="strong" x="40" y="523" width="520" height="31" rx="8"/>
  <text x="300" y="544">#1 · reaction_wheel.txt · Section 1 · 0.94</text>
  </g>
  <g class="step">
    <rect class="strong" x="40" y="559" width="520" height="31" rx="8"/>
  <text x="300" y="580">#2 · EPS.txt · Section 2 · 0.91</text>
  </g>
  <g class="step">
    <rect class="strong" x="40" y="595" width="520" height="31" rx="8"/>
  <text x="300" y="616">#3 · reaction_wheel.txt · Section 3 · 0.84</text>
  </g>
  <g class="step">
    <rect class="strong" x="40" y="631" width="520" height="31" rx="8"/>
  <text x="300" y="652">#4 · EPS.txt · Section 1 · 0.79</text>
  </g>
  <text class="small" x="300" y="692">#5 · EPS.txt · Section 4 · 0.65</text>
  <text class="small" x="300" y="728">#6 · reaction_wheel.txt · Section 5 · 0.60</text>
  <path class="line" d="M 576 610 H 641" marker-end="url(#arrow)"/>
  <g class="step">
    <rect class="box" x="644" y="504" width="292" height="206" rx="8"/>
  <text class="heading" x="790" y="532">Return four sections</text>
  <text class="small" x="790" y="558">Complete stored raw_content</text>
  <text class="small" x="790" y="584">Knowledge / file / section</text>
  <text class="small" x="790" y="610">identity accompanies each item.</text>
  <text class="small" x="790" y="636">Scores are not returned.</text>
  </g>
  <text class="small" x="480" y="792">Local means one named knowledge, which can contain multiple source files.</text>
  <text class="small" x="480" y="819">Names, section ordinals, and similarity values are illustrative—not recorded results or probabilities.</text>
</svg>
