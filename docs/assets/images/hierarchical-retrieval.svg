<svg xmlns="http://www.w3.org/2000/svg" width="960" height="840" viewBox="0 0 960 840" role="img" aria-labelledby="title description">
  <title id="title">Local hierarchical retrieval</title>
  <desc id="description">A named knowledge fixes the scope. The LLM scores section metadata across its files in batches, validates identifier and score output, and returns the highest-ranked complete sections. No knowledge-selection or file-scoring completion is required.</desc>
  <style>
    svg { display: block; margin: 0 auto; color: #202020; background: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .box { fill: #fafafa; stroke: #aaa; stroke-width: 1.5; }
    .strong { fill: #f0f0f0; stroke: #333; stroke-width: 1.5; }
    .panel { fill: none; stroke: #ccc; stroke-width: 1; }
    .line { fill: none; stroke: #777; stroke-width: 1.5; }
    .optional { stroke-dasharray: 5 4; }
    .arrow { fill: #777; }
    text { fill: currentColor; text-anchor: middle; font-size: 16px; }
    .heading { font-size: 18px; font-weight: 600; }
    .small { fill: #595959; font-size: 14px; }
    @media (prefers-color-scheme: dark) {
      svg { color: #eee; background: #111; }
      .box { fill: #191919; stroke: #777; }
      .strong { fill: #292929; stroke: #ccc; }
      .panel { stroke: #555; }
      .line { stroke: #aaa; }
      .arrow { fill: #aaa; }
      .small { fill: #bbb; }
    }
  </style>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="arrow" d="M 0 0 L 10 5 L 0 10 Z"/></marker></defs>
  <g class="step">
    <rect class="strong" x="140" y="20" width="680" height="76" rx="8"/>
  <text class="heading" x="480" y="46">Local hierarchical retrieval</text>
  <text x="480" y="64">Query + explicit knowledge: Engineering</text>
  <text class="small" x="480" y="82">No knowledge-selection completion is needed.</text>
  </g>
  <path class="line" d="M 480 96 V 131" marker-end="url(#arrow)"/>
  <g class="step">
    <rect class="box" x="140" y="134" width="680" height="152" rx="8"/>
  <text class="heading" x="480" y="162">1. Gather section metadata across Engineering's files</text>
  <text x="480" y="188">reaction_wheel.txt · Sections 1, 3, 5</text>
  <text x="480" y="214">EPS.txt · Sections 1, 2, 4</text>
  <text class="small" x="480" y="240">Summary · keywords · conditions · definitions</text>
  <text class="small" x="480" y="266">The scoring prompt does not receive candidate raw_content.</text>
  </g>
  <path class="line" d="M 480 286 V 314 H 239 V 343" marker-end="url(#arrow)"/>
  <g class="step">
    <rect class="strong" x="24" y="346" width="430" height="178" rx="8"/>
  <text class="heading" x="239" y="374">2. Score with the LLM</text>
  <text class="small" x="239" y="400">Read metadata in bounded batches.</text>
  <text class="small" x="239" y="426">Include scored anchors in later reads.</text>
  <text class="small" x="239" y="452">Validate IDs and integer scores (0–10).</text>
  <text class="small" x="239" y="478">Retry invalid structured output.</text>
  </g>
  <path class="line" d="M 454 435 H 503" marker-end="url(#arrow)"/>
  <g class="step">
    <rect class="box" x="506" y="346" width="430" height="178" rx="8"/>
  <text class="heading" x="721" y="374">3. Rank the scored sections</text>
  <text x="721" y="400">reaction_wheel.txt / S3 → 9</text>
  <text x="721" y="426">EPS.txt / S2 → 8</text>
  <text x="721" y="452">reaction_wheel.txt / S1 → 7</text>
  <text class="small" x="721" y="478">Other candidates also receive scores.</text>
  </g>
  <path class="line" d="M 721 524 V 554 H 480 V 581" marker-end="url(#arrow)"/>
  <g class="step">
    <rect class="strong" x="140" y="584" width="680" height="152" rx="8"/>
  <text class="heading" x="480" y="612">4. Return the selected complete sections</text>
  <text x="480" y="638">reaction_wheel.txt · Section 3</text>
  <text x="480" y="664">EPS.txt · Section 2</text>
  <text x="480" y="690">reaction_wheel.txt · Section 1</text>
  <text class="small" x="480" y="716">Stored raw_content + source identities; no score fields.</text>
  </g>
  <text class="small" x="480" y="790">The scope is all section candidates in Engineering, not an initial vector shortlist.</text>
  <text class="small" x="480" y="819">Example scores are relevance judgments, not probabilities. No mandatory file-scoring stage is inserted.</text>
</svg>
