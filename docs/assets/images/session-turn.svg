<svg xmlns="http://www.w3.org/2000/svg" width="960" height="940" viewBox="0 0 960 940" role="img" aria-labelledby="title description">
  <title id="title">A session turn from submission to durable completion</title>
  <desc id="description">Session.start opens shared conversation storage. Submission validates the query, assigns a turn UUID, claims the conversation and initializes memory. A session task runs the harness, then commits messages and the result in SQLite, reconciles context and vector memory, attempts a title, releases ownership and completes. This new-turn path distinguishes agent completion, the database commit and successful completion of the outer task.</desc>
  <style>
    svg { display: block; margin: 0 auto; color: #202020; background: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .box { fill: #fafafa; stroke: #aaa; stroke-width: 1.5; }
    .strong { fill: #f0f0f0; stroke: #333; stroke-width: 1.5; }
    .line { fill: none; stroke: #777; stroke-width: 1.5; }
    .arrow { fill: #777; }
    text { fill: currentColor; text-anchor: middle; font-size: 16px; }
    .heading { font-size: 18px; font-weight: 600; }
    .small { fill: #595959; font-size: 14px; }
    @media (prefers-color-scheme: dark) {
      svg { color: #eee; background: #111; }
      .box { fill: #191919; stroke: #777; }
      .strong { fill: #292929; stroke: #ccc; }
      .line { stroke: #aaa; }
      .arrow { fill: #aaa; }
      .small { fill: #bbb; }
    }
  </style>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="arrow" d="M 0 0 L 10 5 L 0 10 Z"/></marker></defs>
  <g class="step">
    <rect class="box" x="140" y="20" width="680" height="70" rx="8"/>
  <text class="heading" x="480" y="48">Temporary Session + managed Conversation</text>
  <text class="small" x="480" y="74">Session.start() opens storage; it does not initialize model memory.</text>
  </g>
  <path class="line" d="M 480 90 V 121" marker-end="url(#arrow)"/>
  <g class="step">
    <rect class="box" x="140" y="124" width="680" height="96" rx="8"/>
  <text class="heading" x="480" y="152">Validate submission → assign turn UUID → claim conversation</text>
  <text class="small" x="480" y="178">Initialize memory; reconcile pending memory indexing if needed.</text>
  <text class="small" x="480" y="204">A competing turn is rejected. Submission failures release the claim.</text>
  </g>
  <path class="line" d="M 480 220 V 257" marker-end="url(#arrow)"/>
  <g class="step">
    <rect class="strong" x="140" y="260" width="680" height="70" rx="8"/>
  <text class="heading" x="480" y="288">Submit the managed session task</text>
  <text class="small" x="480" y="314">Use a new operation or reuse the caller's; children share that operation.</text>
  </g>
  <path class="line" d="M 480 330 V 369" marker-end="url(#arrow)"/>
  <g class="step">
    <rect class="box" x="140" y="372" width="680" height="86" rx="8"/>
  <text class="heading" x="480" y="400">Run AgentHarness and collect its result</text>
  <text class="small" x="480" y="422">Prepare context → model/tools → optional source reconstruction.</text>
  <text class="small" x="480" y="444">chat.completed means agent completion, not saved-turn completion.</text>
  </g>
  <path class="line" d="M 480 458 V 497" marker-end="url(#arrow)"/>
  <g class="step">
    <rect class="strong" x="140" y="500" width="680" height="86" rx="8"/>
  <text class="heading" x="480" y="528">Commit messages.sqlite3 · one transaction</text>
  <text class="small" x="480" y="550">Canonical messages + turn/result record + context addition.</text>
  <text class="small" x="480" y="572">The turn is now saved, even if later work fails.</text>
  </g>
  <path class="line" d="M 480 586 V 625" marker-end="url(#arrow)"/>
  <g class="step">
    <rect class="box" x="140" y="628" width="680" height="86" rx="8"/>
  <text class="heading" x="480" y="656">Reconcile the derived memory state</text>
  <text class="small" x="480" y="678">Reload active context → index original text → mark memory_indexed.</text>
  <text class="small" x="480" y="700">conversation.turn_commit.completed follows successful reconciliation.</text>
  </g>
  <path class="line" d="M 480 714 V 753" marker-end="url(#arrow)"/>
  <g class="step">
    <rect class="box" x="140" y="756" width="680" height="76" rx="8"/>
  <text class="heading" x="480" y="784">Best-effort title attempt → release conversation claim</text>
  <text class="small" x="480" y="810">Title errors do not normally undo the turn; cancellation still propagates.</text>
  </g>
  <path class="line" d="M 480 832 V 871" marker-end="url(#arrow)"/>
  <g class="step">
    <rect class="strong" x="140" y="874" width="680" height="48" rx="8"/>
  <text class="heading" x="480" y="904">Session task succeeds; SessionRun.collect() returns the result.</text>
  </g>
</svg>
