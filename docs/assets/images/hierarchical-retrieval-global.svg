<svg xmlns="http://www.w3.org/2000/svg" width="960" height="840" viewBox="0 0 960 840" role="img" aria-labelledby="title description">
  <title id="title">Global hierarchical retrieval</title>
  <desc id="description">Global retrieval normally scores knowledge summaries first and then scores sections inside selected knowledges. The optional full_retrieval path skips knowledge selection and uses all knowledges. Both are global-only routes, not local retrieval.</desc>
  <style>
    svg { display: block; margin: 0 auto; color: #202020; background: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .box { fill: #fafafa; stroke: #aaa; stroke-width: 1.5; }
    .strong { fill: #f0f0f0; stroke: #333; stroke-width: 1.5; }
    .panel { fill: none; stroke: #ccc; stroke-width: 1; }
    .line { fill: none; stroke: #777; stroke-width: 1.5; }
    .optional { stroke-dasharray: 5 4; }
    .arrow { fill: #777; }
    text { fill: currentColor; text-anchor: middle; font-size: 16px; }
    .heading { font-size: 18px; font-weight: 600; }
    .small { fill: #595959; font-size: 14px; }
    @media (prefers-color-scheme: dark) {
      svg { color: #eee; background: #111; }
      .box { fill: #191919; stroke: #777; }
      .strong { fill: #292929; stroke: #ccc; }
      .panel { stroke: #555; }
      .line { stroke: #aaa; }
      .arrow { fill: #aaa; }
      .small { fill: #bbb; }
    }
  </style>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="arrow" d="M 0 0 L 10 5 L 0 10 Z"/></marker></defs>
  <g class="step">
    <rect class="strong" x="140" y="20" width="680" height="76" rx="8"/>
  <text class="heading" x="480" y="46">Global hierarchical retrieval</text>
  <text x="480" y="64">Query + this user's knowledge base</text>
  <text class="small" x="480" y="82">Engineering · Narrative · Medical</text>
  </g>
  <path class="line" d="M 480 96 V 113 H 239 V 131" marker-end="url(#arrow)"/>
  <path class="line optional" d="M 480 113 H 721 V 131" marker-end="url(#arrow)"/>
  <g class="step">
    <rect class="strong" x="24" y="134" width="430" height="152" rx="8"/>
  <text class="heading" x="239" y="162">1. Score knowledge summaries · LLM</text>
  <text x="239" y="188">Engineering: 9 · Narrative: 4 · Medical: 1</text>
  <text class="small" x="239" y="214">Example: top_k_knowledge = 1</text>
  <text class="small" x="239" y="240">Selected knowledge: Engineering</text>
  </g>
  <g class="step">
    <rect class="box" x="506" y="134" width="430" height="152" rx="8"/>
  <text class="heading" x="721" y="162">Optional: full_retrieval = True</text>
  <text class="small" x="721" y="188">Skip knowledge-summary selection.</text>
  <text class="small" x="721" y="214">Consider sections from all knowledges.</text>
  <text class="small" x="721" y="240">Dashed route replaces step 1.</text>
  </g>
  <path class="line" d="M 239 286 V 319 H 480 V 347" marker-end="url(#arrow)"/>
  <path class="line optional" d="M 721 286 V 319 H 480" marker-end="url(#arrow)"/>
  <g class="step">
    <rect class="box" x="140" y="350" width="680" height="126" rx="8"/>
  <text class="heading" x="480" y="378">2. Gather sections within the selected knowledge scope</text>
  <text x="480" y="404">Example default path: Engineering's reaction_wheel.txt + EPS.txt</text>
  <text class="small" x="480" y="430">Summary · keywords · conditions · definitions</text>
  <text class="small" x="480" y="456">Full-retrieval bypass would include Narrative and Medical too.</text>
  </g>
  <path class="line" d="M 480 476 V 497 H 239 V 519" marker-end="url(#arrow)"/>
  <g class="step">
    <rect class="strong" x="24" y="522" width="430" height="144" rx="8"/>
  <text class="heading" x="239" y="550">3. Score section metadata · LLM</text>
  <text class="small" x="239" y="576">Bounded batches and prior-score anchors</text>
  <text class="small" x="239" y="602">Validate IDs and 0–10 scores; retry failures.</text>
  <text class="small" x="239" y="628">No full candidate text in the scoring prompt.</text>
  </g>
  <path class="line" d="M 454 594 H 503" marker-end="url(#arrow)"/>
  <g class="step">
    <rect class="box" x="506" y="522" width="430" height="144" rx="8"/>
  <text class="heading" x="721" y="550">4. Rank across the selected scope</text>
  <text x="721" y="576">reaction_wheel.txt / S3 → 9</text>
  <text x="721" y="602">EPS.txt / S2 → 8</text>
  <text class="small" x="721" y="628">Return up to top_k_section sections in total.</text>
  </g>
  <path class="line" d="M 721 666 V 690 H 480 V 717" marker-end="url(#arrow)"/>
  <g class="step">
    <rect class="strong" x="140" y="720" width="680" height="74" rx="8"/>
  <text class="heading" x="480" y="748">5. Return complete stored sections</text>
  <text class="small" x="480" y="774">raw_content + knowledge / file / section identity; no scores</text>
  </g>
  <text class="small" x="480" y="819">Illustrative scores and selections. Global selection remains inside the current user's knowledge base.</text>
</svg>
