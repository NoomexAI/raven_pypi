[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "noomexai-raven"
version = "0.2.0"
description = "RAVEN — Retrieval Augmented Adaptive Epistemic Navigation. Privacy-first, fully offline RAG backend."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE.txt"]
requires-python = ">=3.11"
dependencies = [
    "llama-index-core>=0.14,<0.15",
    "llama-index-llms-ollama>=0.10,<0.11",
    "llama-index-embeddings-ollama>=0.9,<0.10",
    "llama-index-vector-stores-qdrant>=0.10,<0.11",
    "qdrant-client>=1.12",
    "ollama>=0.5",
    "curl-cffi>=0.9.0",
    "pydantic>=2.0",
    "docling>=2.0,<3.0",
    "zstandard>=0.23.0; platform_system == 'Linux'",
]

[project.optional-dependencies]
server = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
]
litellm = [
    "llama-index-llms-litellm>=0.7,<0.8",
    "llama-index-embeddings-litellm>=0.5,<0.6",
    "litellm>=1.41,<2",
]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries",
]

[project.urls]
Homepage = "https://github.com/NoomexAI/raven_pypi"
Repository = "https://github.com/NoomexAI/raven_pypi"
Issues = "https://github.com/NoomexAI/raven_pypi/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["raven*"]

[tool.ruff]
target-version = "py311"
line-length = 120
select = ["E", "F", "I", "W", "UP", "B", "C4"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: tests that require external services or real model assets",
]
